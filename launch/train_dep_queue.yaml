# DEP Level 2 -- ACT model training queue (NO ARIA variants)
#
# Trains ACT policies on the 6 no_aria DEP datasets.
# Robot cameras only (top + wrist_0 + wrist_1), no aria gaze streams.
# Each job trains for 100K steps, saves checkpoints every 10K.
#
# Usage:
#   python scripts/queue_training.py --config launch/train_dep_queue.yaml
#
# Or train individual datasets manually:
#   lerobot-train \
#     --dataset.repo_id=RAPOB/dep_coffee_pod_gold_no_aria \
#     --dataset.video_backend=pyav \
#     --policy.type=act \
#     --output_dir=outputs/train/dep_pod_gold_no_aria \
#     --steps=100000 --save_freq=10000 --log_freq=200 \
#     --wandb.enable=false --num_workers=0 --batch_size=8

